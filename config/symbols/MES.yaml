symbol: MES
ib_symbol: MES
exchange: CME
asset_class: equity_index
full_size_equivalent: ES        # 1/10 of ES

databento:
  dataset: GLBX.MDP3
  parent_symbol: MES.FUT        # stype_in=parent -> all listed MES futures
  schema: ohlcv-1m

contract_spec:
  tick_size: 0.25               # index points
  tick_value: 1.25              # USD per tick
  point_value: 5.00             # tick_value / tick_size
  currency: USD
  verified: true                # IB reqContractDetails, paper 4002               # -> scripts/verify_contract_specs.py

contract_months: [H, M, U, Z]   # Mar Jun Sep Dec
rollover:
  rule: volume_crossover
  confirm_days: 1              # tuned on 3mo real data (Phase 1 sweep)
  calendar_backstop_days: 3    # last resort only -- must not preempt the crossover
  candidate: highest_volume

session:
  timezone: America/Chicago
  mode: rth_and_eth
  globex_open: "17:00"          # prior calendar day
  globex_close: "16:00"
  maintenance_halt: ["16:00", "17:00"]
  # Open CONFIRMED EMPIRICALLY: the peak 5-minute volume bucket sits exactly
  # at 08:30 CT for all three index micros (scripts/empirical_rth.py, 66
  # sessions). The close is NOT determinable from volume -- it decays smoothly
  # rather than stopping -- so the 15:15 CT settlement is used, which costs
  # ~1.5% of session volume to include and is structurally meaningful.
  # IB liquidHours (08:30-16:00) was not used; see config/data.yaml.
  rth_open: "08:30"
  rth_close: "15:15"
  rth_source: empirical_open_conventional_close
  use_eth_range: false          # spec S2: prior day H/L from RTH only

day_boundary: "17:00"           # Globex open = start of trade date

volume_baseline: session_matched   # spec S12: RTH-avg vs RTH-bar, never blended

liquidity_filter:
  min_avg_volume: null          # spec: set from backtest, do not guess

margin_source: ibkr_api         # never hardcode; fetch live
