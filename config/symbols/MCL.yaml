symbol: MCL
ib_symbol: MCL
exchange: NYMEX
asset_class: energy
full_size_equivalent: CL        # 1/10 of CL (100 bbl vs 1,000 bbl)

databento:
  dataset: GLBX.MDP3
  parent_symbol: MCL.FUT
  schema: ohlcv-1m

contract_spec:
  tick_size: 0.01               # USD per barrel
  tick_value: 1.00
  point_value: 100.00
  currency: USD
  verified: true                # IB reqContractDetails, paper 4002

# Monthly listing -- 12 rolls/year, not 4. Spec flags this as needing more
# frequent rollover handling than the quarterly index contracts.
contract_months: [F, G, H, J, K, M, N, Q, U, V, X, Z]
rollover:
  rule: volume_crossover
  confirm_days: 1              # tuned on 3mo real data (Phase 1 sweep)
  calendar_backstop_days: 2    # last resort only -- must not preempt the crossover
  candidate: highest_volume

session:
  timezone: America/Chicago
  mode: continuous
  globex_open: "17:00"
  globex_close: "16:00"
  maintenance_halt: ["16:00", "17:00"]
  # NO RTH SPLIT. The volume profile shows real overnight and overseas trade
  # with no isolable day session: even at a 50% target the shortest window
  # holding that share spans 7.3-8.4h and starts pre-dawn CT (MGC 06:35-15:00,
  # SIL 06:00-13:25, MCL 06:15-13:35). Forcing an RTH window here would invent
  # a boundary the market does not have, so these three are treated like MET --
  # full Globex session as the day scope -- while keeping the 17:00 CT day
  # boundary they share with the index micros.
  rth_open: null
  rth_close: null
  rth_source: not_applicable_empirical
  use_eth_range: true

day_boundary: "17:00"           # Globex open = start of trade date

volume_baseline: hour_of_day       # no RTH/ETH split to match against;
                                   # same substitute MET uses (spec S12)

liquidity_filter:
  min_avg_volume: null

margin_source: ibkr_api
