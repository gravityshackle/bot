symbol: MYM
ib_symbol: MYM
exchange: CBOT
asset_class: equity_index
full_size_equivalent: YM        # 1/10 of YM

databento:
  dataset: GLBX.MDP3
  parent_symbol: MYM.FUT        # stype_in=parent -> all listed MES futures
  schema: ohlcv-1m

contract_spec:
  tick_size: 1.00               # index points
  tick_value: 0.50              # USD per tick
  point_value: 0.50             # tick_value / tick_size
  currency: USD
  verified: true                # IB reqContractDetails, paper 4002               # -> scripts/verify_contract_specs.py

contract_months: [H, M, U, Z]   # Mar Jun Sep Dec
rollover:
  rule: volume_crossover
  confirm_days: 1              # tuned on 3mo real data (Phase 1 sweep)
  calendar_backstop_days: 3    # last resort only -- must not preempt the crossover
  candidate: highest_volume

session:
  timezone: America/Chicago
  mode: rth_and_eth
  globex_open: "17:00"          # prior calendar day
  globex_close: "16:00"
  maintenance_halt: ["16:00", "17:00"]
  # RTH determined EMPIRICALLY (highest-volume window), not from IB liquidHours
  # and not from assumed pit hours. IB returns the same generic 08:30-16:00 CT
  # window for every instrument -- including MET, which has no session concept
  # at all -- which shows it is a platform default, not instrument-specific
  # truth. scripts/empirical_rth.py fills these in from cached bars.
  rth_open: null
  rth_close: null
  rth_source: empirical_pending
  use_eth_range: false          # spec S2: prior day H/L from RTH only

day_boundary: "17:00"           # Globex open = start of trade date

volume_baseline: session_matched   # spec S12: RTH-avg vs RTH-bar, never blended

liquidity_filter:
  min_avg_volume: null          # spec: set from backtest, do not guess

margin_source: ibkr_api         # never hardcode; fetch live
