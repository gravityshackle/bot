# Full-size COMEX Silver -- 5,000 troy oz. NOT in the current trading scope
# (the seven micros are). Kept as a DISTINCT entry rather than merged with
# SIL, because IB exposes both under the same ib_symbol "SI" and they differ
# only by multiplier. Merging them under one config is precisely how you end
# up sizing a 5,000oz position while believing you hold a 1,000oz one.
#
#   SIL (micro)     multiplier 1000   $5.00/tick
#   SI  (full)      multiplier 5000   $25.00/tick   <- this file
#
# data/sources/ibkr_contracts.py refuses to resolve either without an
# ib_multiplier disambiguator.
symbol: SI
in_scope: false                 # not traded; present for spec completeness
ib_symbol: SI
ib_multiplier: 5000             # REQUIRED disambiguator vs SIL
ib_local_symbol_root: SI
exchange: COMEX
asset_class: metals
micro_equivalent: SIL

databento:
  dataset: GLBX.MDP3
  parent_symbol: SI.FUT
  schema: ohlcv-1m

contract_spec:
  tick_size: 0.005              # USD per troy oz
  tick_value: 25.00             # 5x the micro
  point_value: 5000.00
  currency: USD
  verified: true                # IB reqContractDetails, paper 4002

contract_months: [F, G, H, J, K, M, N, Q, U, V, X, Z]   # IB lists all twelve
rollover:
  rule: volume_crossover
  confirm_days: 2
  calendar_backstop_days: 5
  candidate: next_chronological

session:
  timezone: America/Chicago
  mode: rth_and_eth
  globex_open: "17:00"
  globex_close: "16:00"
  maintenance_halt: ["16:00", "17:00"]
  # RTH determined EMPIRICALLY (highest-volume window), not from IB liquidHours
  # and not from assumed pit hours. IB returns the same generic 08:30-16:00 CT
  # window for every instrument -- including MET, which has no session concept
  # at all -- which shows it is a platform default, not instrument-specific
  # truth. scripts/empirical_rth.py fills these in from cached bars.
  rth_open: null
  rth_close: null
  rth_source: empirical_pending
  use_eth_range: false

day_boundary: "17:00"           # Globex open = start of trade date

volume_baseline: session_matched   # spec S12: RTH-avg vs RTH-bar, never blended

liquidity_filter:
  min_avg_volume: null

margin_source: ibkr_api
